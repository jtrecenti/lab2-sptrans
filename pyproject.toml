[project]
name = "lab2-sptrans"
version = "0.1.0"
description = "Pipeline de ETL e modelagem preditiva da oferta de onibus da SPTrans (GTFS + API Olho Vivo)"
readme = "README.md"
authors = [{ name = "Julio Trecenti", email = "julio.trecenti@gmail.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "plotnine>=0.13",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.1",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
lab2 = "lab2_sptrans.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
